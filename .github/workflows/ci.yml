name: Local Validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: local-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and synthetic fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.16.0
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Scan for high-confidence secrets
        run: npm run security

      - name: Validate repository and synthetic contracts
        run: npm run validate

  dependency-review:
    name: Review dependency and license changes
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0